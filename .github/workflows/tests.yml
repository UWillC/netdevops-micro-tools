name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      # Avoid protobuf/ethpm plugin collision observed locally; pure-Python
      # parsing is fine for test-time workloads.
      PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION: python
      # No background PSIRT sync in tests: the runner has no cache and no credentials.
      CVE_WARMUP_SYNC: '0'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run tests
        run: pytest tests/ -v

  # Deploy only what passed. Render's own "After CI Checks Pass" trigger held the
  # deploy back but never released it after a green run (tested 2026-09-18), so the
  # release is ours: auto-deploy is OFF in Render and this job calls the deploy hook.
  deploy:
    needs: pytest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy for this commit
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::RENDER_DEPLOY_HOOK_URL is not set - tests passed but nothing was deployed."
            exit 1
          fi
          # -o /dev/null: the response echoes the deploy id only, but keep logs clean
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST "${RENDER_DEPLOY_HOOK_URL}&ref=${GITHUB_SHA}")
          echo "Render deploy hook answered HTTP $code for $GITHUB_SHA"
          [ "$code" -ge 200 ] && [ "$code" -lt 300 ]
