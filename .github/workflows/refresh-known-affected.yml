name: Refresh Known Affected lists

# The repo copy of cve_data/*/known_affected is what production starts from
# after every deploy and what offline/local users get permanently. Production
# refreshes its own copy on each PSIRT sync; nothing refreshed this one.
# Refresh-only: never creates records, never touches curated fields.

on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-known-affected
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION: python
      CISCO_CLIENT_ID: ${{ secrets.CISCO_CLIENT_ID }}
      CISCO_CLIENT_SECRET: ${{ secrets.CISCO_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Refresh
        id: refresh
        run: |
          if [ -z "$CISCO_CLIENT_ID" ] || [ -z "$CISCO_CLIENT_SECRET" ]; then
            echo "::error::CISCO_CLIENT_ID / CISCO_CLIENT_SECRET repository secrets are not set - nothing was checked."
            exit 1
          fi
          python scripts/refresh_known_affected.py
      - name: Audit advisory references
        # Fails the run (GitHub mails the owner) when a record points at an
        # advisory id PSIRT does not have for that CVE, or at a CVE PSIRT
        # does not know. Found seven such records by hand on 2026-09-18.
        run: python scripts/audit_advisory_refs.py
      - name: Anything changed?
        id: diff
        run: |
          if git diff --quiet -- cve_data; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Lists already current."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- cve_data | tail -1
          fi
      - name: Tests must pass before data is committed
        if: steps.diff.outputs.changed == 'true'
        run: pytest tests/ -q
      - name: Commit
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cve_data
          git commit -m "data: refresh Known Affected lists from Cisco PSIRT ($(date -u +%F))"
          git push
